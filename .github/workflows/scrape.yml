name: daily-update
on:
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:      

jobs:
  scrape-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests django djangorestframework beautifulsoup4

      - name: Run update script
        run: python update_ratings.py
        env:
          DJANGO_SETTINGS_MODULE: backend.settings

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/players/players.csv
          git commit -m "Automated rating update" || exit 0
          git push