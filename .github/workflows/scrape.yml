name: daily-update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-job:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      
      - name: Install dependencies
        run: pip install requests django djangorestframework

      - name: Scrape Ratings
        run: python -m players.update_ratings
        working-directory: backend 
        env:
          PYTHONPATH: .

      - name: Commit and Push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the file using the full path from the root
          git add backend/players/players.csv
          git commit -m "Automated update" || echo "No changes to commit"
          git push

      - name: Reload PythonAnywhere
        run: |
          curl -X POST "https://www.pythonanywhere.com/api/v1/user/redcomp16/webapps/redcomp16.pythonanywhere.com/reload/" \
            -H "Authorization: Token ${{ secrets.PA_TOKEN }}"
